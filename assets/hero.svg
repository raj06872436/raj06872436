<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<style>
.b1{animation:m1 14s ease-in-out infinite alternate}
.b2{animation:m2 18s ease-in-out infinite alternate}
.b3{animation:m3 16s ease-in-out infinite alternate}
@keyframes m1{to{transform:translate(160px,60px) scale(1.2)}}
@keyframes m2{to{transform:translate(-200px,-40px) scale(1.15)}}
@keyframes m3{to{transform:translate(90px,-70px) scale(0.85)}}
.f0{animation:fl 6s ease-in-out infinite}
.f1{animation:fl 6s ease-in-out -2s infinite}
.f2{animation:fl 6s ease-in-out -4s infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.f0,.f1,.f2{transform-box:fill-box}
.dot{animation:pulse 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.caret{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sweep{animation:sw 7s linear infinite}
@keyframes sw{from{transform:translateX(-400px)}to{transform:translateX(1600px)}}

.w0{opacity:0;animation:w0 12.0s infinite}
@keyframes w0{0%,0.00%{opacity:0;transform:translateY(14px)}3.00%,21.00%{opacity:1;transform:translateY(0)}24.00%,100%{opacity:0;transform:translateY(-14px)}}
.w1{opacity:0;animation:w1 12.0s infinite}
@keyframes w1{0%,24.99%{opacity:0;transform:translateY(14px)}28.00%,46.00%{opacity:1;transform:translateY(0)}49.00%,100%{opacity:0;transform:translateY(-14px)}}
.w2{opacity:0;animation:w2 12.0s infinite}
@keyframes w2{0%,49.99%{opacity:0;transform:translateY(14px)}53.00%,71.00%{opacity:1;transform:translateY(0)}74.00%,100%{opacity:0;transform:translateY(-14px)}}
.w3{opacity:0;animation:w3 12.0s infinite}
@keyframes w3{0%,74.99%{opacity:0;transform:translateY(14px)}78.00%,96.00%{opacity:1;transform:translateY(0)}99.00%,100%{opacity:0;transform:translateY(-14px)}}
</style>
<defs>
  <clipPath id="c"><rect width="1200" height="430" rx="28"/></clipPath>
  <linearGradient id="txt" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".7"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".15"/></linearGradient>
  <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
  <radialGradient id="fade" cx=".35" cy=".45" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="m"><rect width="1200" height="430" fill="url(#fade)"/></mask>
</defs>
<g clip-path="url(#c)">
  <rect width="1200" height="430" fill="#07070d"/>
  <g filter="url(#blur)">
    <circle class="b1" cx="230" cy="120" r="190" fill="#7c3aed" fill-opacity=".55"/>
    <circle class="b2" cx="980" cy="330" r="210" fill="#0891b2" fill-opacity=".45"/>
    <circle class="b3" cx="640" cy="420" r="170" fill="#db2777" fill-opacity=".35"/>
  </g>
  <rect width="1200" height="430" fill="url(#grid)" mask="url(#m)"/>
  <rect class="sweep" x="0" y="0" width="260" height="430" fill="url(#beam)" transform="skewX(-20)"/>

  <g transform="translate(70 74)">
    <rect width="236" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
    <circle class="dot" cx="20" cy="17" r="5" fill="#22c55e"/>
    <circle cx="20" cy="17" r="5" fill="#22c55e"/>
    <text x="36" y="22" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#e5e7eb">Now building LARX</text>
    <text x="190" y="22" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" fill="#a5b4fc">v1</text>
  </g>

  <text x="66" y="210" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-3" fill="url(#name)">Raj Naik</text>
  <text x="70" y="262" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">I build practical software for India. Lately:</text>
  <g transform="translate(70 318)"><text class="w0" x="0" y="0" fill="url(#txt)" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Helvetica, Arial, sans-serif" font-size="30" font-weight="600">computer vision for Indian farms</text><text class="w1" x="0" y="0" fill="url(#txt)" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Helvetica, Arial, sans-serif" font-size="30" font-weight="600">fraud models you can explain</text><text class="w2" x="0" y="0" fill="url(#txt)" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Helvetica, Arial, sans-serif" font-size="30" font-weight="600">audits where every number is sourced</text><text class="w3" x="0" y="0" fill="url(#txt)" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Helvetica, Arial, sans-serif" font-size="30" font-weight="600">ball speed from a phone camera</text></g>
  <text x="70" y="378" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#64748b">B.Tech IT  /  CS + ML + finance  /  ship it, then prove it<tspan class="caret" fill="#a78bfa"> _</tspan></text>

  <g transform="translate(840 0)">
  <g transform="translate(0 70)"><g class="f0">
    <rect width="300" height="84" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="url(#edge)" stroke-opacity="0.9"/>
    <text x="24" y="44" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#fff">12</text>
    <text x="24" y="66" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Helvetica, Arial, sans-serif" font-size="13.5" fill="#a5b4fc">audit pillars in LARX</text>
  </g></g>
  <g transform="translate(0 174)"><g class="f1">
    <rect width="300" height="84" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="url(#edge)" stroke-opacity="0.9"/>
    <text x="24" y="44" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#fff">99.5%</text>
    <text x="24" y="66" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Helvetica, Arial, sans-serif" font-size="13.5" fill="#a5b4fc">leaf disease accuracy</text>
  </g></g>
  <g transform="translate(0 278)"><g class="f2">
    <rect width="300" height="84" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="url(#edge)" stroke-opacity="0.9"/>
    <text x="24" y="44" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#fff">3</text>
    <text x="24" y="66" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Helvetica, Arial, sans-serif" font-size="13.5" fill="#a5b4fc">live products you can try</text>
  </g></g>
  </g>
  <rect x=".5" y=".5" width="1199" height="429" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</g>
</svg>