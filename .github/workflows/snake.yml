name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake-arcade.svg?color_snake=#ffd319&color_dots=#22174d,#4b2a8a,#7a3fd1,#ff3ea5,#2de2e6
            dist/snake-arcade-light.svg?color_snake=#2b59c3&color_dots=#ece8ff,#c9bcff,#9b7bff,#ff3ea5,#ffb000
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
