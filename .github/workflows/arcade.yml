name: Arcade

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: arcade
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'issues' || (github.event.label.name == 'approved' && startsWith(github.event.issue.title, 'Guestbook'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the current board
        run: git clone --depth 1 --branch output "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" prev || mkdir -p prev

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake-arcade.svg?color_snake=#ffd319&color_dots=#22174d,#4b2a8a,#7a3fd1,#ff3ea5,#2de2e6
            dist/snake-arcade-light.svg?color_snake=#2b59c3&color_dots=#ece8ff,#c9bcff,#9b7bff,#ff3ea5,#ffb000

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw scoreboard and guestbook
        id: draw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: ${{ github.workspace }}/dist
        run: |
          sudo chown -R "$USER" dist
          pip install --quiet fonttools brotli
          cp prev/guestbook.json dist/ 2>/dev/null || true
          cd .github/scripts
          python scoreboard.py
          python guestbook.py

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Thank the visitor
        if: steps.draw.outputs.added == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "You're on the board! Thanks for playing."
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}

      - name: Make sure the approve label exists
        if: github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create approved --repo ${{ github.repository }} --color 7cff6b --description "Show this on the guestbook" --force
